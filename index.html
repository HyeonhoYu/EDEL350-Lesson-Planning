<style>
:root{
  --paper:#F4F6F8; --sheet:#FFFFFF; --ink:#1D2A36; --muted:#5C6B78; --line:#D5DCE3;
  --pencil:#F2B33D; --pencil-ink:#5E4100; --navy:#24476B; --navy-ink:#FFFFFF;
  --sage:#3F7D5C; --brick:#B2453A; --soft:#EAF0F5;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181E; --sheet:#1A222A; --ink:#E6ECF1; --muted:#9AA8B4; --line:#2E3A46;
    --navy:#8DB4DC; --navy-ink:#0F1A24; --sage:#7BC29C; --brick:#E58A7F; --soft:#222D37;
    --pencil-ink:#3A2800;
  }
}
:root[data-theme="dark"]{
  --paper:#12181E; --sheet:#1A222A; --ink:#E6ECF1; --muted:#9AA8B4; --line:#2E3A46;
  --navy:#8DB4DC; --navy-ink:#0F1A24; --sage:#7BC29C; --brick:#E58A7F; --soft:#222D37;
  --pencil-ink:#3A2800;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.top-inner{display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--muted);white-space:nowrap}
.unit-name{font-family:var(--serif);font-weight:700;font-size:1.3rem;flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit-name.empty{color:var(--muted);font-weight:600}
.save-state{font-size:.85rem;color:var(--muted);white-space:nowrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.92rem}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:.85rem;font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--brick);background:transparent}
.btn.link{border:none;background:none;color:var(--navy);padding:0;text-decoration:underline;cursor:pointer;font-weight:700}

/* layout */
.wrap{display:grid;grid-template-columns:264px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:0}
.side{padding:28px 0 28px 20px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto}
.side h2{font-family:var(--serif);font-size:.95rem;color:var(--muted);margin:0 0 10px 12px;font-weight:600}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:10px 14px 10px 12px;border-radius:8px 0 0 8px;position:relative}
.step:hover{background:var(--soft)}
.step .num{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.82rem;font-weight:700;color:var(--muted);background:var(--sheet)}
.step .lbl{flex:1;font-weight:700;font-size:.95rem}
.step .st{font-size:.75rem;color:var(--muted)}
.step[data-status="done"] .num{background:var(--sage);border-color:var(--sage);color:var(--sheet)}
.step[data-status="partial"] .num{border-color:var(--pencil)}
.step[aria-current="step"]{background:var(--pencil);color:var(--pencil-ink)}
.step[aria-current="step"] .st{color:var(--pencil-ink)}
.step[aria-current="step"]::after{content:"";position:absolute;right:-20px;top:0;bottom:0;width:20px;background:var(--pencil)}
.side-foot{margin:22px 0 0 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:.88rem}

.main{background:var(--sheet);border-left:6px solid var(--pencil);min-height:calc(100vh - 64px);padding:36px 48px 80px}
.main > .inner{max-width:760px}
.sec-head h1{font-family:var(--serif);font-size:2rem;line-height:1.15;margin:0 0 8px}
.sec-head p.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}

.guide{border:1px solid var(--line);border-radius:8px;margin:0 0 28px;background:var(--soft)}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:.92rem;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::before{content:"+";display:inline-block;width:18px;font-weight:700}
.guide[open] summary::before{content:"\2212"}
.guide .g-body{padding:0 16px 14px 32px;font-size:.93rem}
.guide .g-body ul{margin:6px 0;padding-left:18px}
.guide .example{border-left:3px solid var(--navy);padding:6px 12px;margin:10px 0 0;background:var(--sheet);border-radius:0 6px 6px 0}
.guide .example b{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}

.field{margin:0 0 20px}
.field label,.field .flabel{display:block;font-weight:700;margin-bottom:5px}
.field .req{color:var(--brick);font-weight:700;margin-left:4px}
.field .hint{display:block;color:var(--muted);font-size:.86rem;margin:-2px 0 6px}
input[type=text],input[type=url],textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--sheet);line-height:1.45}
textarea{resize:vertical;min-height:74px}
input:focus,textarea:focus,select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 22%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.list{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.li{display:flex;gap:8px;align-items:flex-start}
.li .idx{flex:0 0 30px;padding-top:9px;color:var(--muted);font-weight:700;font-size:.9rem;text-align:right}
.li > .grow{flex:1;display:flex;flex-direction:column;gap:6px}
.li .ghost{margin-top:5px}
.std-grid{display:grid;grid-template-columns:130px 1fr;gap:6px}

.block{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 18px}
.block h3{font-family:var(--serif);font-size:1.15rem;margin:0 0 4px}
.block > p.sub{margin:0 0 12px;color:var(--muted);font-size:.9rem}

.lesson{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;background:var(--sheet)}
.lesson > summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center;list-style:none}
.lesson > summary::-webkit-details-marker{display:none}
.lesson .lnum{font-family:var(--serif);font-weight:700;font-size:1.05rem;white-space:nowrap}
.lesson .ltitle{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .ltitle.empty{color:var(--muted);font-weight:400;font-style:italic}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.tag.ira{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.tag.detailed{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}
.tag.miss{color:var(--brick);border-color:var(--brick)}
.lesson[open] > summary{border-bottom:1px solid var(--line)}
.lesson .lbody{padding:18px 16px 6px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400;font-size:.92rem;cursor:pointer}
.checks input{width:16px;height:16px;accent-color:var(--navy)}
.empty-note{color:var(--muted);font-size:.88rem;font-style:italic}
.type-pick{display:flex;gap:6px;flex-wrap:wrap}
.type-pick label{border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center}
.type-pick input{accent-color:var(--navy)}
.req-summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px;font-size:.9rem}
.req-summary span{padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.req-summary span.ok{border-color:var(--sage);color:var(--sage);font-weight:700}
.req-summary span.no{border-color:var(--brick);color:var(--brick);font-weight:700}

/* review */
.score{display:flex;gap:28px;align-items:baseline;margin:0 0 22px;flex-wrap:wrap}
.score .big{font-family:var(--serif);font-size:3rem;font-weight:700;line-height:1}
.score .cap{color:var(--muted);font-size:.92rem}
.issues{list-style:none;padding:0;margin:0 0 28px;border:1px solid var(--line);border-radius:8px}
.issues li{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.issues li:first-child{border-top:none}
.issues .lvl{flex:0 0 62px;font-size:.75rem;font-weight:700;padding-top:3px}
.issues .lvl.err{color:var(--brick)}
.issues .lvl.warn{color:#9A6A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .issues .lvl.warn{color:var(--pencil)}}
.issues .msg{flex:1}
.issues .where{font-size:.85rem}
.allclear{padding:14px 16px;border:1px solid var(--sage);color:var(--sage);border-radius:8px;font-weight:700;margin:0 0 28px}
.matrix-wrap{overflow-x:auto;margin:0 0 28px;border:1px solid var(--line);border-radius:8px}
table.matrix{border-collapse:collapse;font-size:.85rem;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--sheet);max-width:240px;overflow:hidden;text-overflow:ellipsis}
.matrix thead th{background:var(--soft)}
.matrix thead th:first-child{background:var(--soft)}
.matrix td.hit{color:var(--sage);font-weight:700}
.matrix tr.gap td:first-child{color:var(--brick);font-weight:700}
.exports{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.note{color:var(--muted);font-size:.88rem}
h2.h{font-family:var(--serif);font-size:1.3rem;margin:30px 0 10px}

.nav-foot{display:flex;justify-content:space-between;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:8px;font-weight:700;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.show{opacity:1}


.slinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:0 0 10px}
.slinks a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:6px;color:var(--ink);text-decoration:none;background:var(--sheet)}
.slinks a:hover{background:var(--soft)}
.slinks a b{color:var(--navy)}
.slinks a span{font-size:.84rem;color:var(--muted)}

.sgroup{margin:0 0 18px}
.sgroup h4{font-family:var(--serif);font-size:1.05rem;margin:0}
.sgroup .sub{margin:0 0 8px;color:var(--muted);font-size:.88rem}
.scard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.scard p{margin:0;font-family:var(--serif);font-size:1.05rem;font-weight:600}
.scard .scodes{grid-column:1;font-size:.8rem;color:var(--muted)}
.scard .btn{grid-column:2;grid-row:1 / span 2}
.scard.on{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--navy)}
.sublist{margin:0 0 14px}
@media (max-width:860px){.scard{grid-template-columns:1fr}.scard .btn{grid-column:1;grid-row:auto;justify-self:start}}

/* mascot */
.brand{display:flex;align-items:center;gap:8px}
.brand-frog{width:30px;height:30px;object-fit:contain}
.sec-head{display:flex;align-items:flex-end;gap:20px;justify-content:space-between}
.sec-text{flex:1;min-width:0}
.mascot{flex:0 0 auto;height:150px;width:auto;margin:-10px 0 14px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.mascot.is-frog{height:96px}
.mascot.small{height:44px;margin:0}
.hop{animation:hop .5s ease-out both}
@keyframes hop{0%{transform:translateY(14px) scale(.96);opacity:0}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
.allclear{display:flex;align-items:center;gap:12px}
img.tavatar{background:var(--soft);object-fit:contain;padding:2px}
@media (max-width:860px){.mascot{height:96px}.mascot.is-frog{height:64px}}
@media (prefers-reduced-motion: reduce){.hop{animation:none}}

.tbody{position:relative}
.tart{float:right;margin:-6px 0 6px 14px}
.mascot.tfig{height:110px;margin:0}
.mascot.is-wide{height:auto;width:220px}
.mascot.small{height:64px}
.sleepy{display:flex;gap:24px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:20px}
.sleepy p{margin:0 0 8px}
.sleepy > div{flex:1;min-width:220px}
@media (max-width:860px){.mascot.tfig{height:76px}.mascot.is-wide{width:160px}}

/* tutor */
.tutor-wrap{border:2px solid var(--navy);border-radius:10px;margin:0 0 26px;background:var(--sheet)}
.tutor-wrap > summary{cursor:pointer;padding:12px 16px;font-family:var(--serif);font-weight:700;font-size:1.1rem;list-style:none;background:var(--soft);border-radius:8px}
.tutor-wrap > summary::-webkit-details-marker{display:none}
.tutor-wrap[open] > summary{border-bottom:1px solid var(--line);border-radius:8px 8px 0 0}
.tutor{padding:16px 18px 18px}
.tsteps{list-style:none;margin:0 0 18px;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.tdot{border:1px solid var(--line);background:var(--sheet);border-radius:20px;padding:4px 12px 4px 4px;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--muted)}
.tdot span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.tdot.past span{background:var(--sage);color:var(--sheet)}
.tdot.on{border-color:var(--pencil);background:var(--pencil);color:var(--pencil-ink)}
.tdot.on span{background:var(--sheet);color:var(--ink)}
.th{font-family:var(--serif);font-size:1.4rem;line-height:1.25;margin:0 0 14px}
.tbubble{display:flex;gap:12px;align-items:flex-start;margin:0 0 16px}
.tbubble > div{background:var(--soft);border-radius:4px 14px 14px 14px;padding:10px 14px;max-width:62ch}
.tavatar{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.tsum{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 16px 46px;font-size:.92rem;display:grid;gap:6px}
.tsum b{display:inline-block;min-width:96px;color:var(--muted)}
.tq{font-weight:700;margin:6px 0 8px}
.topts{display:grid;gap:8px;margin:0 0 16px}
.topt{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.topt.on{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--navy)}
.topt input{margin-top:4px;accent-color:var(--navy)}
.topt > span{display:flex;flex-direction:column;gap:2px}
.topt i{color:var(--muted);font-size:.9rem}
.tcheck{margin:0 0 8px}
.tmeter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:0 0 14px}
.tmeter span{display:block;height:100%;background:var(--sage)}
.tmpl{font-family:var(--serif);font-size:1.12rem;font-weight:600;margin:8px 0;padding:8px 12px;background:var(--sheet);border-left:3px solid var(--pencil)}
.tstems{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.tstems .tq{margin:0 4px 0 0}
.tbtnrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tres{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px}
.tres li{padding:8px 12px;border-radius:6px;border:1px solid var(--line);font-size:.93rem}
.tres li.err{border-color:var(--brick);color:var(--brick)}
.tres li.warn{border-color:var(--pencil)}
.tres li.ok{border-color:var(--sage);color:var(--sage);font-weight:700}
.tself{display:grid;gap:8px;margin:0 0 16px}
.tself label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tself input{margin-top:4px;width:16px;height:16px;accent-color:var(--sage)}
.tex{margin:0 0 12px}
.tnav{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.tright{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){.tsum{margin-left:0}.tdot{font-size:0}.tdot span{font-size:.82rem}.tdot{padding:4px}}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .side{position:sticky;top:0;max-height:none;padding:8px 10px;background:var(--paper);border-bottom:1px solid var(--line);z-index:10;overflow-x:auto}
  .side h2,.side-foot{display:none}
  .steps{display:flex;gap:4px}
  .step{border-radius:8px;padding:8px 10px;white-space:nowrap}
  .step .st{display:none}
  .step[aria-current="step"]::after{display:none}
  .main{border-left:none;border-top:4px solid var(--pencil);padding:24px 18px 60px}
  .top{position:static}
  .top-inner{padding:10px 16px}
  .row2,.std-grid{grid-template-columns:1fr}
  .sec-head h1{font-size:1.6rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{.top,.side,.nav-foot{display:none}.main{border:none}}
</style>

<body>
<header class="top">
  <div class="top-inner">
    <span class="brand"><img class="brand-frog" src="" data-art="gfrog" alt="">Unit Plan Builder</span>
    <span class="unit-name empty" id="unitName">Untitled unit</span>
    <span class="save-state" id="saveState">Not saved yet</span>
    <div class="top-actions">
      <button class="btn" data-act="nav" data-sec="review">Check my plan</button>
      <button class="btn primary" data-act="exportDocx">Download Word</button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="side" aria-label="Plan sections">
    <h2>Your unit plan</h2>
    <ol class="steps" id="steps"></ol>
    <div class="side-foot">
      <button class="btn link" data-act="loadSample">Load sample unit</button>
      <button class="btn link" data-act="reset">Start a new plan</button>
    </div>
  </nav>
  <main class="main" id="main"><div class="inner" id="inner"></div></main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
"use strict";
const KEY = "unitPlanBuilder.v1";
const LESSON_TARGET = 10;
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const filled = s => typeof s === "string" && s.trim().length > 0;

function blankLesson(){ return {id:uid(), title:"", type:"regular", strand:"", desc:"", materials:"", standards:[], objectives:[], procedure:"", check:"", time:""}; }
function blankTutor(){ return {step:0, topic:"", seed:0, picked:"", why:"", type:"", focus:[], role:"", task:"", purpose:"", audience:"", issue:"", local:"", draft:"", self:[], bigIdea:"", understanding:"", essential:"", evidence:{}, prepost:"", rubric:""}; }
function blankCurr(){ return {ckla:"", grade:"", domain:"", domainOther:"", skills:"", skillsOther:"", relation:"", explain:""}; }
function blankPlan(){
  return {
    curr:blankCurr(),
    meta:{title:"", grade:"", subject:"", author:"", overview:""},
    dq:{driving:"", subs:[""]},
    dqTutor:blankTutor(),
    standards:[{id:uid(), code:"", text:""}],
    objectives:[{id:uid(), text:""}],
    assess:{pre:"", formative:[{id:uid(), title:"", desc:"", link:""}], summative:[{id:uid(), title:"", desc:""}]},
    lessons:Array.from({length:LESSON_TARGET}, blankLesson),
    resources:{texts:"", tech:"", other:""},
    diff:{gifted:"", support:"", other:""},
    reflect:{worked:"", improve:""}
  };
}

let plan = load() || blankPlan();
let current = "overview";
const openLessons = new Set();

function load(){
  try{ const raw = localStorage.getItem(KEY); if(!raw) return null; return normalize(JSON.parse(raw)); }catch(e){ return null; }
}
function normalize(p){
  const b = blankPlan();
  if(!p || typeof p !== "object") return b;
  const out = Object.assign(b, p);
  out.meta = Object.assign(blankPlan().meta, p.meta||{});
  out.dq = Object.assign({driving:"", subs:[""]}, p.dq||{});
  out.dqTutor = Object.assign(blankTutor(), p.dqTutor||{});
  out.curr = Object.assign(blankCurr(), p.curr||{});
  if(!out.dqTutor.evidence || typeof out.dqTutor.evidence!=="object") out.dqTutor.evidence = {};
  out.assess = Object.assign({pre:"", formative:[], summative:[]}, p.assess||{});
  out.resources = Object.assign({texts:"",tech:"",other:""}, p.resources||{});
  out.diff = Object.assign({gifted:"",support:"",other:""}, p.diff||{});
  out.reflect = Object.assign({worked:"",improve:""}, p.reflect||{});
  ["standards","objectives","lessons"].forEach(k => { if(!Array.isArray(out[k])) out[k] = b[k]; });
  out.lessons = out.lessons.map(l => Object.assign(blankLesson(), l));
  return out;
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  document.getElementById("saveState").textContent = "Saving...";
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(KEY, JSON.stringify(plan)); document.getElementById("saveState").textContent = "Saved in this browser"; }
    catch(e){ document.getElementById("saveState").textContent = "Not saved: download your plan to keep a copy"; }
  }, 400);
}

/* path helpers */
function getP(path){ return path.split(".").reduce((o,k) => o == null ? undefined : o[k], plan); }
function setP(path, val){
  const ks = path.split("."); let o = plan;
  for(let i=0;i<ks.length-1;i++) o = o[ks[i]];
  o[ks[ks.length-1]] = val;
}

/* ---------- sections ---------- */
const SECTIONS = [
  {id:"overview", label:"Unit basics"},
  {id:"standards", label:"Standards"},
  {id:"dq", label:"Driving question"},
  {id:"objectives", label:"Learning objectives"},
  {id:"assess", label:"Assessments"},
  {id:"lessons", label:"Learning activities"},
  {id:"resources", label:"Resources"},
  {id:"diff", label:"Differentiation"},
  {id:"reflect", label:"Reflection"},
  {id:"review", label:"Review and export"}
];

function field(label, path, o={}){
  const v = getP(path) || "";
  const id = "f_" + path.replace(/\./g,"_");
  const req = o.req ? '<span class="req" aria-hidden="true">*</span>' : "";
  const hint = o.hint ? `<span class="hint" id="${id}_h">${esc(o.hint)}</span>` : "";
  const desc = o.hint ? ` aria-describedby="${id}_h"` : "";
  const ctl = o.multi
    ? `<textarea id="${id}" data-path="${path}" rows="${o.rows||3}" placeholder="${esc(o.ph||"")}"${desc}>${esc(v)}</textarea>`
    : `<input type="text" id="${id}" data-path="${path}" value="${esc(v)}" placeholder="${esc(o.ph||"")}"${desc}>`;
  return `<div class="field"><label for="${id}">${esc(label)}${req}</label>${hint}${ctl}</div>`;
}
function guide(title, tips, example){
  return `<details class="guide"><summary>${esc(title)}</summary><div class="g-body">
    <ul>${tips.map(t=>`<li>${t}</li>`).join("")}</ul>
    ${example ? `<div class="example"><b>Example</b>${example}</div>` : ""}
  </div></details>`;
}
const ART = {"front": "images/front.webp", "side": "images/side.webp", "back": "images/back.webp", "gfrog": "images/gfrog.webp", "tfrog": "images/tfrog.webp", "wave": "images/wave.webp", "pray": "images/pray.webp", "jumpfrogs": "images/jumpfrogs.webp", "read": "images/read.webp", "point": "images/point.webp", "clap": "images/clap.webp", "sleep": "images/sleep.webp", "hug2": "images/hug2.webp", "jump": "images/jump.webp", "hugfrog": "images/hugfrog.webp", "sit": "images/sit.webp", "wink": "images/wink.webp", "lookup": "images/lookup.webp"};
const SEC_ART = {overview:"wave", standards:"read", dq:"lookup", objectives:"point", assess:"wink", lessons:"sit", resources:"front", diff:"hug2", reflect:"pray", review:"jump"};
const TUTOR_ART = ["hugfrog","clap","side","back","jumpfrogs"];
function mascot(kind, cls){ return `<img class="mascot ${cls||""} ${/^[gt]frog$/.test(kind)?"is-frog":""} ${kind==="sleep"?"is-wide":""}" src="${ART[kind]}" alt="">`; }
function head(title, lead){ return `<div class="sec-head"><div class="sec-text"><h1>${esc(title)}</h1><p class="lead">${lead}</p></div>${mascot(SEC_ART[current]||"gfrog","hop")}</div>`; }
function removeBtn(arr, i, what){ return `<button class="btn ghost small" data-act="remove" data-arr="${arr}" data-i="${i}" aria-label="Remove ${esc(what)} ${i+1}">Remove</button>`; }

const RENDER = {
  overview(){
    return head("Unit basics", "Name your unit and describe the big picture in a few sentences. This becomes the first rows of your plan.")
    + guide("How to write a strong overview", [
        "Say what students will explore and how the topics connect to each other.",
        "Keep it to 2 to 4 sentences. Details belong in later sections.",
        "A catchy unit title helps students remember the unit."
      ], "In this unit, students explore maps and map features, organisms and their habitats, landforms, and natural disasters. Connected lessons build an understanding of how natural disasters affect the environment and the organisms living in it.")
    + field("Unit title", "meta.title", {req:true, ph:"e.g., The Map of Your World"})
    + `<div class="row2">${field("Grade level", "meta.grade", {req:true, ph:"e.g., Grade 3"})}${field("Content areas", "meta.subject", {ph:"e.g., Science, Social Studies, ELA"})}</div>`
    + field("Your name", "meta.author", {ph:"Shown on the exported plan"})
    + field("Unit overview", "meta.overview", {req:true, multi:true, rows:5})
    + cklaBlock();
  },
  dq(){
    const subs = plan.dq.subs.map((s,i)=>`<div class="li"><span class="idx">${i+1}.</span><div class="grow"><input type="text" data-path="dq.subs.${i}" value="${esc(s)}" aria-label="Subquestion ${i+1}" placeholder="Something students need to learn to answer the DQ"></div>${removeBtn("dq.subs",i,"subquestion")}</div>`).join("");
    const openTutor = !filled(plan.dq.driving) || plan.dqTutor.step>0;
    return head("Driving question", "One question that captures the heart of the unit and gives every lesson a purpose. The tutor below walks you through it step by step.")
    + `<details class="tutor-wrap" ${openTutor?"open":""}><summary>Driving question tutor</summary>${tutor()}</details>`
    + `<div class="block" id="dqFinal"><h3>Your driving question</h3><p class="sub">Use the tutor, or type it here directly.</p>`
    + field("Driving question", "dq.driving", {req:true, multi:true, rows:2})
    + `<div class="field"><span class="flabel">Subquestions that support the driving question<span class="req" aria-hidden="true">*</span></span><span class="hint">What will students need to learn to answer the DQ? Each subquestion should match something you teach in a lesson.</span><div class="list">${subs}</div><button class="btn small" data-act="add" data-arr="dq.subs" data-kind="str">Add subquestion</button></div></div>`;
  },
  standards(){
    const rows = plan.standards.map((s,i)=>`<div class="li"><span class="idx">${i+1}.</span><div class="grow std-grid">
      <input type="text" data-path="standards.${i}.code" value="${esc(s.code)}" aria-label="Standard ${i+1} code" placeholder="Code, e.g. 3.G.1">
      <textarea data-path="standards.${i}.text" rows="2" aria-label="Standard ${i+1} text" placeholder="Full text of the standard">${esc(s.text)}</textarea>
    </div>${removeBtn("standards",i,"standard")}</div>`).join("");
    return head("Standards", "List every standard the unit addresses, with its code and full text. Include standards from each content area.")
    + guide("Tips for standards", [
        "Copy the code exactly as it appears in the official PDF so it can be linked to lessons later.",
        "Include standards from more than one content area when the unit is integrated (for example, science plus ELA).",
        "Every standard you list should appear in at least one lesson. The review page checks this for you."
      ], "3.G.1 Use labels and symbols to locate and identify physical and political features on maps and/or globes.")
    + `<div class="block stdlinks"><h3>Find your standards</h3><p class="sub">Open your subject on the Indiana Department of Education site, choose the PDF for your grade, and copy the code and the full text of each standard into the boxes below.</p>
        <div class="slinks">
          <a href="https://www.in.gov/doe/students/indiana-academic-standards/englishlanguage-arts" target="_blank" rel="noopener noreferrer"><b>English/Language Arts</b><span>2023 standards</span></a>
          <a href="https://www.in.gov/doe/students/indiana-academic-standards/mathematics" target="_blank" rel="noopener noreferrer"><b>Mathematics</b><span>2023 standards</span></a>
          <a href="https://www.in.gov/doe/students/indiana-academic-standards/science-and-computer-science" target="_blank" rel="noopener noreferrer"><b>Science</b><span>2023 standards</span></a>
          <a href="https://www.in.gov/doe/students/indiana-academic-standards/social-studies" target="_blank" rel="noopener noreferrer"><b>Social Studies</b><span>2026 and 2023 standards</span></a>
        </div>
        <p class="note">Social Studies has a new 2026 version listed next to the 2023 version. Ask your instructor or mentor teacher which one your practicum school uses. Links open in a new tab.</p>
      </div>`
    + `<div class="list">${rows}</div><button class="btn small" data-act="add" data-arr="standards" data-kind="std">Add standard</button>`;
  },
  objectives(){
    const rows = plan.objectives.map((o,i)=>`<div class="li"><span class="idx">${i+1}.</span><div class="grow"><input type="text" data-path="objectives.${i}.text" value="${esc(o.text)}" aria-label="Objective ${i+1}" placeholder="describe what plants need to survive."></div>${removeBtn("objectives",i,"objective")}</div>`).join("");
    return head("Learning objectives", "By the end of this unit, students will be able to:")
    + guide("Writing objectives you can assess", [
        "Start with one observable verb: describe, identify, design, explain, compare, argue.",
        "Avoid verbs you cannot see, like understand, know, or learn about.",
        "Do not repeat the same content with a different verb. For example, \u201cidentify cardinal directions\u201d and \u201crecognize cardinal directions\u201d can be one objective.",
        "Every objective should be taught in at least one lesson and checked by at least one assessment."
      ], "explain how natural disasters affect people, plants, and animals.")
    + `<div class="list">${rows}</div><button class="btn small" data-act="add" data-arr="objectives" data-kind="obj">Add objective</button>`;
  },
  assess(){
    const f = plan.assess.formative.map((a,i)=>`<div class="li"><span class="idx">${i+1}.</span><div class="grow">
      <input type="text" data-path="assess.formative.${i}.title" value="${esc(a.title)}" aria-label="Formative ${i+1} name" placeholder="Name, e.g. Treasure hunt">

function verbs(topic){
  const last = (topic.trim().split(/\s+/).pop()||"").toLowerCase();

function rng(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }

function detectCats(){
  const stds = plan.standards.filter(s=>filled(s.code));
  const found = CATS.map(c=>({c, codes:stds.filter(s=>c.re.test(s.text)).map(s=>s.code.trim())})).filter(x=>x.codes.length);
  return found.length ? found : [{c:CATS[0], codes:[]}, {c:CATS[1], codes:[]}];
}

  const found = detectCats();
  const prodPool = found.flatMap(x=>x.c.products.map(p=>({p, codes:x.codes, what:x.c.what})));
  const rolePool = found.flatMap(x=>x.c.roles.map(p=>({p, codes:x.codes, products:x.c.products})));
  const aud = audiences();
  const out = [];
  const used = new Set();
  const add = (type, text, info) => { if(used.has(text)) return; used.add(text); out.push(Object.assign({type, text}, info)); };
  for(let i=0;i<3;i++){
    const pr = pick(r, prodPool), a = pick(r, aud);
    const forms = [
      `How can we create ${art(pr.p)} about ${topic} for ${a}?`,
      `How can we make ${art(pr.p)} that helps ${a} understand ${topic}?`,
      `How can we use what we learn about ${topic} to make ${local} a better place?`
    ];
    add("product", forms[(i + (t.seed||0)) % forms.length], {product:pr.p, audience:a, codes:pr.codes, task:`create ${art(pr.p)} about ${topic}`});
  }
  for(let i=0;i<3;i++){
    const ro = pick(r, rolePool), pr = {p:pick(r, ro.products), codes:[]}, a = pick(r, aud);
    const forms = [
      `How can we, as ${ro.p}, create ${art(pr.p)} that teaches ${a} about ${topic}?`,
      `How do we, as ${ro.p}, show ${a} why ${topic} ${V.matters} in ${local}?`,
      `How can we, as ${ro.p}, plan ${art(pr.p)} that helps people in ${local} learn about ${topic}?`
    ];
    add("role", forms[(i + (t.seed||0)) % forms.length], {role:ro.p, product:pr.p, audience:a, codes:[...new Set([...ro.codes, ...pr.codes])], task:`create ${art(pr.p)} about ${topic}`});
  }
  const deb = [
    `${cap(V.does)} ${topic} matter to people in ${local}?`,
    `What would ${local} be like without ${topic}?`,
    `Should everyone in ${local} learn about ${topic}?`,
    `${cap(V.is)} ${topic} more helpful or more harmful to ${local}?`,
    `How ${V.does} ${topic} change the way people live in ${local}?`,
    `Should our school do more to teach families about ${topic}?`
  ];
  const s0 = ((t.seed||0)*3) % deb.length;
  for(let i=0;i<3;i++) add("debate", deb[(s0+i)%deb.length], {codes:[], task:"share and defend their answer"});
  return out;
}
function subSuggestions(){
  const t = plan.dqTutor;
  const topic = filled(t.topic) ? t.topic.trim() : "___";
  const V = verbs(topic);
  const groups = [];
  const start = [`What do we already know about ${topic}, and what do we need to find out?`, `What words do we need to know to talk about ${topic}?`, `Why should we care about ${topic}?`];
  if(filled(t.local)) start.push(`How ${V.does} ${topic} affect ${t.local.trim()}?`, `Where can we see ${topic} in ${t.local.trim()}?`);
  groups.push({name:"Getting started", items:start.map(q=>({q, codes:[]}))});
  const end = [];
  if(t.type==="debate"){ end.push(`What is our answer to the driving question, and what evidence supports it?`, `What would someone who disagrees with us say?`); }
  else {
    const prod = (t.task||"").replace(/^create (an? )?/,"").replace(/ about .*$/,"");
    if(prod) end.push(`What makes a great ${prod}?`);
    if(filled(t.role)) end.push(`What do real ${t.role.trim()} do, and how can we work like them?`);
    if(filled(t.audience)) end.push(`What do ${t.audience.trim()} already know about ${topic}, and what do they need to learn?`);
    end.push(`How will we share our work, and how will we know it was successful?`);
  }
  groups.push({name:"For your end product", items:end.map(q=>({q, codes:[]}))});
  detectCats().forEach(x=>groups.push({name:"To "+x.c.what, items:x.c.subs(topic, V).map(q=>({q, codes:x.codes}))}));
  return groups;
}

function dqChecks(q){
  const out = [];
  const s = (q||"").trim();
  if(!s) return out;
  const w = s.split(/\s+/).length;
  if(!/\?$/.test(s)) out.push(["warn","End it with a question mark."]);
  if(/_{2,}/.test(s)) out.push(["err","Fill in every blank (___)."]);
  if(/^(what is|what are|who is|who are|when|where|define|list|name|which)\b/i.test(s)) out.push(["warn","Questions that start like this can often be answered with a single fact. Try How can we, Should, or What would happen if."]);
  if(w<6) out.push(["warn","This is very short. Does it say enough to give the unit a direction?"]);
  if(w>30) out.push(["warn",`At ${w} words this may be hard for students to remember. Try to say it in one breath.`]);
  const stdWords = new Set(plan.standards.flatMap(x=>words(x.text||"")).filter(x=>x.length>=8 && !STOP.has(x)));
  const hits = [...new Set(words(s).filter(x=>stdWords.has(x)))];
  if(hits.length>=2) out.push(["warn",`It repeats standards vocabulary (${hits.slice(0,4).join(", ")}). You do not need to state the content in the question. Students will need it anyway to answer.`]);
  const long = words(s).filter(x=>x.length>=12);
  if(long.length) out.push(["warn",`Will your students understand "${long[0]}"? Use their words when you can.`]);
  const pk = (plan.dqTutor.picked||"").trim();
  if(pk){
    const norm = x => words(x).join(" ");
    if(norm(s)===norm(pk)) out.push(["warn","This is exactly the suggestion you picked. Make it yours: change words, add your school or town, or sharpen the task."]);
    else {
      const A = words(s), B = new Set(words(pk));
      const same = A.filter(x=>B.has(x)).length / Math.max(A.length, B.size);
      if(same>=0.85) out.push(["warn","This is still very close to the suggestion you picked. Try a bigger change: add your school or town, name a real audience, or give students a real job to do."]);
    }
  }
  if(!out.length) out.push(["ok","No problems found by the automatic check. Now use the four questions below."]);
  return out;
}

function tutor(){
  const t = plan.dqTutor, step = Math.max(0, Math.min(4, t.step||0));
  const dots = `<ol class="tsteps">${TSTEPS.map((n,i)=>`<li><button class="tdot ${i===step?"on":""} ${i<step?"past":""}" data-act="tstep" data-step="${i}" ${i===step?'aria-current="step"':""}><span>${i+1}</span>${n}</button></li>`).join("")}</ol>`;
  return `<div class="tutor">${dots}<div class="tbody"><div class="tart">${mascot(TUTOR_ART[step],"hop tfig")}</div>${TUTOR[step]()}</div></div>`;
}

function matrix(kind){
  const rows = kind==="standards" ? plan.standards.filter(s=>filled(s.code)) : plan.objectives.filter(o=>filled(o.text));
  if(!rows.length) return `<p class="empty-note">Nothing to show yet.</p>`;
  const L = plan.lessons;
  const headRow = `<tr><th scope="col">${kind==="standards"?"Standard":"Objective"}</th>${L.map((l,i)=>`<th scope="col" title="${esc(l.title)}">L${i+1}</th>`).join("")}</tr>`;
  const body = rows.map(r=>{
    const name = kind==="standards" ? r.code : `${plan.objectives.indexOf(r)+1}. ${r.text}`;
    const hits = L.map(l=>l[kind].includes(r.id));
    return `<tr class="${hits.some(Boolean)?"":"gap"}"><td title="${esc(kind==="standards"?r.text:r.text)}">${esc(name)}</td>${hits.map(h=>`<td class="${h?"hit":""}">${h?"Yes":""}</td>`).join("")}</tr>`;
  }).join("");
  return `<div class="matrix-wrap"><table class="matrix"><thead>${headRow}</thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- checks ---------- */
const PLACEHOLDER = /\[[A-Za-z][^\]]{2,}\]/;
function walkStrings(o, fn, path=""){
  if(typeof o==="string") return fn(o, path);
  if(Array.isArray(o)) return o.forEach((v,i)=>walkStrings(v, fn, path+"."+i));
  if(o && typeof o==="object") Object.keys(o).forEach(k=>{ if(k!=="id") walkStrings(o[k], fn, path?path+"."+k:k); });
}
function words(s){ return s.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean); }

function checkPlan(){
  const out = [];
  const E = (sec,msg,lid)=>out.push({lvl:"err",sec,msg,lid});
  const W = (sec,msg,lid)=>out.push({lvl:"warn",sec,msg,lid});
  const p = plan;
  if(!filled(p.meta.title)) E("overview","Add a unit title.");
  if(!filled(p.meta.grade)) E("overview","Add the grade level.");
  if(!filled(p.meta.overview)) E("overview","Write the unit overview.");
  if(!filled(p.dq.driving)) E("dq","Write the driving question.");
  else if(!/\?\s*$/.test(p.dq.driving.trim())) W("dq","The driving question does not end with a question mark.");
  if(!p.dq.subs.some(filled)) E("dq","Add at least one subquestion.");
  const stds = p.standards.filter(s=>filled(s.code)||filled(s.text));
  if(!stds.length) E("standards","Add at least one standard.");
  stds.forEach((s,i)=>{ if(!filled(s.code)) E("standards",`Standard ${i+1} is missing its code.`); if(!filled(s.text)) E("standards",`Standard ${s.code||i+1} is missing its full text.`); });
  const objs = p.objectives.filter(o=>filled(o.text));
  if(!objs.length) E("objectives","Add at least one learning objective.");
  for(let a=0;a<objs.length;a++) for(let b=a+1;b<objs.length;b++){
    const wa = words(objs[a].text), wb = words(objs[b].text);
    const restSame = wa.slice(1).join(" ") === wb.slice(1).join(" ") && wa.length>1;
    const sa = new Set(wa), sb = new Set(wb); const inter=[...sa].filter(x=>sb.has(x)).length; const jac = inter/(new Set([...sa,...sb]).size||1);
    if(restSame || jac>=0.8) W("objectives",`Objectives ${p.objectives.indexOf(objs[a])+1} and ${p.objectives.indexOf(objs[b])+1} look almost the same. Consider combining them.`);
  }
  const vague = /^(understand|know|learn|appreciate|be aware)/i;
  objs.forEach(o=>{ if(vague.test(o.text.trim())) W("objectives",`Objective ${p.objectives.indexOf(o)+1} starts with a verb you cannot observe ("${o.text.trim().split(/\s+/)[0]}"). Try describe, identify, or explain.`); });
  if(!filled(p.assess.pre)) E("assess","Describe the pre-assessment.");
  const form = p.assess.formative.filter(a=>filled(a.title)||filled(a.desc));
  if(!form.length) E("assess","Add at least one formative assessment.");
  form.forEach((a,i)=>{ if(!filled(a.desc)) E("assess",`Formative assessment "${a.title||i+1}" needs a description.`); });
  const summ = p.assess.summative.filter(a=>filled(a.title)||filled(a.desc));
  if(!summ.length) E("assess","Add at least one summative assessment.");
  summ.forEach((a,i)=>{ if(!filled(a.desc)) E("assess",`Summative assessment "${a.title||i+1}" needs a description.`); });

  const L = p.lessons;
  if(L.length!==LESSON_TARGET) E("lessons",`The plan needs ${LESSON_TARGET} lessons. You have ${L.length}.`);
  if(!L.some(l=>l.type==="ira")) E("lessons","Mark one lesson as the IRA (interactive read-aloud).");
  const det = L.filter(l=>l.type==="detailed").length;
  if(det<2) E("lessons",`Mark ${2-det} more lesson${2-det>1?"s":""} as a detailed plan.`);
  L.forEach((l,i)=>{
    const n = `Lesson ${i+1}${filled(l.title)?" ("+l.title.trim()+")":""}`;
    const miss = [];
    if(!filled(l.title)) miss.push("title"); if(!filled(l.desc)) miss.push("description"); if(!filled(l.materials)) miss.push("materials"); if(!filled(l.time)) miss.push("estimated time");
    if(l.type!=="regular" && !filled(l.procedure)) miss.push("step-by-step procedure");
    if(miss.length) E("lessons",`${n} is missing: ${miss.join(", ")}.`, l.id);
    else if(!l.standards.length) W("lessons",`${n} is not linked to any standard.`, l.id);
  });
  const stdIds = new Set(L.flatMap(l=>l.standards));
  p.standards.filter(s=>filled(s.code)).forEach(s=>{ if(!stdIds.has(s.id)) W("lessons",`Standard ${s.code} is not taught in any lesson.`); });
  const objIds = new Set(L.flatMap(l=>l.objectives));
  objs.forEach(o=>{ if(!objIds.has(o.id)) W("lessons",`Objective ${p.objectives.indexOf(o)+1} is not taught in any lesson.`); });

  if(p.curr.ckla==="yes"){
    if(!cklaDomain()) W("overview","Choose the CKLA domain or unit your mentor teacher is teaching.");
    if(!filled(p.curr.relation) || !filled(p.curr.explain)) W("overview","Explain how your unit connects to the CKLA domain or unit.");
    if(!p.lessons.some(l=>filled(l.strand))) W("lessons","None of your lessons is marked as connecting to CKLA.");
  }
  if(!filled(p.resources.texts)) E("resources","List the main texts and online resources.");
  if(!filled(p.diff.gifted)) E("diff","Add a strategy for gifted learners.");
  if(!filled(p.diff.support)) E("diff","Add a strategy for students who need more support.");

  const seen = new Set();
  walkStrings(p, (s, path)=>{
    if(PLACEHOLDER.test(s)){
      const top = path.split(".")[0];
      const map = {meta:"overview", dq:"dq", dqTutor:"dq", standards:"standards", objectives:"objectives", assess:"assess", lessons:"lessons", resources:"resources", diff:"diff", reflect:"reflect"};
      const sec = map[top] || "overview";
      if(seen.has(sec)) return; seen.add(sec);
      W(sec, `Leftover template text found: "${s.match(PLACEHOLDER)[0]}". Replace it with your own content.`);
    }
  });
  return out;
}

function status(sec){
  const issues = checkPlan().filter(x=>x.sec===sec && x.lvl==="err");
  const any = (()=>{ let f=false; const map={overview:plan.meta, dq:plan.dq, standards:plan.standards, objectives:plan.objectives, assess:plan.assess, lessons:plan.lessons, resources:plan.resources, diff:plan.diff, reflect:plan.reflect}; walkStrings(map[sec]||{}, s=>{ if(filled(s) && !["regular","ira","detailed"].includes(s)) f=true; }); return f; })();
  if(sec==="reflect") return (filled(plan.reflect.worked)&&filled(plan.reflect.improve))?"done":any?"partial":"empty";
  if(!any) return "empty";
  return issues.length ? "partial" : "done";
}

/* ---------- rendering ---------- */
function renderSteps(){
  const el = document.getElementById("steps");
  el.innerHTML = SECTIONS.map((s,i)=>{
    const st = s.id==="review" ? "" : status(s.id);
    const word = st==="done"?"Done":st==="partial"?"In progress":"";
    return `<li><button class="step" data-act="nav" data-sec="${s.id}" data-status="${st}" ${current===s.id?'aria-current="step"':""}><span class="num">${i+1}</span><span class="lbl">${s.label}</span><span class="st">${word}</span></button></li>`;
  }).join("");
}
function renderHeader(){
  const n = document.getElementById("unitName");
  n.textContent = filled(plan.meta.title) ? plan.meta.title : "Untitled unit";
  n.classList.toggle("empty", !filled(plan.meta.title));
}
function renderMain(focusTop){
  const idx = SECTIONS.findIndex(s=>s.id===current);
  const prev = SECTIONS[idx-1], next = SECTIONS[idx+1];
  document.getElementById("inner").innerHTML = RENDER[current]()
    + `<div class="nav-foot">${prev?`<button class="btn" data-act="nav" data-sec="${prev.id}">Back: ${prev.label}</button>`:"<span></span>"}${next?`<button class="btn primary" data-act="nav" data-sec="${next.id}">Next: ${next.label}</button>`:"<span></span>"}</div>`;
  if(focusTop) window.scrollTo({top:0});
}
function renderAll(focusTop){ renderHeader(); renderSteps(); renderMain(focusTop); }

/* ---------- events ---------- */
const main = document.getElementById("main");
main.addEventListener("input", e=>{
  const t = e.target, path = t.dataset.path;
  if(!path || t.type==="radio") return;
  setP(path, t.value); save(); renderSteps();
  if(path==="meta.title") renderHeader();
  const m = path.match(/^lessons\.(\d+)\.title$/);
  if(m){ const s = t.closest(".lesson").querySelector(".ltitle"); s.textContent = filled(t.value)?t.value:"No title yet"; s.classList.toggle("empty", !filled(t.value)); }
});
main.addEventListener("change", e=>{
  const t = e.target;
  if(t.tagName==="SELECT" && t.dataset.path && t.dataset.rerender){ setP(t.dataset.path, t.value); save(); renderSteps(); renderMain(); return; }
  if(t.type==="radio" && t.dataset.path){ setP(t.dataset.path, t.value); save(); rememberOpen(); renderSteps(); renderMain(); return; }
  if(t.dataset.link){
    const arr = getP(t.dataset.link);
    const i = arr.indexOf(t.value);
    if(t.checked && i<0) arr.push(t.value); if(!t.checked && i>=0) arr.splice(i,1);
    save(); renderSteps();
    if(t.dataset.link.startsWith("dqTutor")) renderMain();
  }
  if(t.dataset.path && /^lessons\.\d+\.(title|desc|materials|time|procedure)$/.test(t.dataset.path)){
    const card = t.closest(".lesson"); const l = plan.lessons.find(x=>x.id===card.dataset.lid);
    const incomplete = !filled(l.title)||!filled(l.desc)||!filled(l.materials)||!filled(l.time);
    let tag = card.querySelector("summary .tag.miss");
    if(incomplete && !tag){ tag=document.createElement("span"); tag.className="tag miss"; tag.textContent="Incomplete"; card.querySelector("summary").appendChild(tag); }
    if(!incomplete && tag) tag.remove();
  }
});
main.addEventListener("toggle", e=>{
  const d = e.target; if(!d.classList || !d.classList.contains("lesson")) return;
  if(d.open) openLessons.add(d.dataset.lid); else openLessons.delete(d.dataset.lid);
}, true);
function rememberOpen(){ document.querySelectorAll(".lesson").forEach(d=>{ if(d.open) openLessons.add(d.dataset.lid); else openLessons.delete(d.dataset.lid); }); }

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act==="nav"){
    current = b.dataset.sec;
    if(b.dataset.lid) openLessons.add(b.dataset.lid);
    renderAll(true);
    if(b.dataset.lid){ const d = document.querySelector(`.lesson[data-lid="${b.dataset.lid}"]`); if(d) d.scrollIntoView({block:"start"}); }
    return;
  }
  if(act==="add"){
    const arr = getP(b.dataset.arr);
    const k = b.dataset.kind;
    const item = k==="str" ? "" : k==="std" ? {id:uid(),code:"",text:""} : k==="obj" ? {id:uid(),text:""} : k==="form" ? {id:uid(),title:"",desc:"",link:""} : k==="summ" ? {id:uid(),title:"",desc:""} : blankLesson();
    arr.push(item); if(k==="lesson") openLessons.add(item.id);
    rememberOpen(); save(); renderSteps(); renderMain();
    return;
  }
  if(act==="remove"){
    const arr = getP(b.dataset.arr); const i = +b.dataset.i;
    const it = arr[i];
    const hasContent = (()=>{ let f=false; walkStrings(it, s=>{ if(filled(s) && !["regular","ira","detailed"].includes(s)) f=true; }); return f; })();
    if(hasContent && !confirm("Remove this item? Its content will be deleted.")) return;
    arr.splice(i,1);
    if(it && it.id){ plan.lessons.forEach(l=>{ l.standards = l.standards.filter(x=>x!==it.id); l.objectives = l.objectives.filter(x=>x!==it.id); }); }
    rememberOpen(); save(); renderSteps(); renderMain();
    return;
  }
  if(act==="tstep"){
    const to = +b.dataset.step, from = plan.dqTutor.step||0;
    if(from<=1 && to>=2 && !filled(plan.dqTutor.draft)){ plan.dqTutor.step = 1; save(); renderMain(); return toast("Pick a suggested question first, or type your own in step 3."); }
    if(from===1 && to>=2 && !filled(plan.dqTutor.why)) return toast("Tell me why you picked this one first.");
    plan.dqTutor.step = to; save(); renderMain(); const w=document.querySelector(".tutor-wrap"); if(w) w.scrollIntoView({block:"start"}); return; }
  if(act==="tpick"){
    const x = JSON.parse(b.dataset.v), t = plan.dqTutor;
    if(filled(t.draft) && t.draft.trim()!==t.picked.trim() && !confirm("Replace your edited draft with this suggestion?")) return;
    t.picked = x.text; t.draft = x.text; t.type = x.type; t.role = x.role||""; t.task = x.task||""; t.audience = x.audience||""; t.purpose = "";
    save(); renderMain(); const f=document.getElementById("f_dqTutor_why"); if(f) f.focus(); return;
  }
  if(act==="tckla"){ plan.dqTutor.topic = topicFromTitle(cklaDomain()); save(); renderMain(); return; }
  if(act==="tshuffle"){ plan.dqTutor.seed = (plan.dqTutor.seed||0)+1; save(); renderMain(); return; }
  if(act==="taddsub"){
    const q = b.dataset.v, subs = plan.dq.subs; const i = subs.findIndex(s=>!filled(s));
    if(i>=0) subs[i] = q; else subs.push(q);
    save(); renderSteps(); renderMain(); return;
  }
  if(act==="tgo"){ const el=document.getElementById(b.dataset.target); if(el) el.scrollIntoView({block:"start"}); return; }
  if(act==="tstem"){ plan.dqTutor.draft = b.dataset.v; save(); renderMain(); const d=document.getElementById("f_dqTutor_draft"); if(d){ d.focus(); const k=d.value.indexOf("___"); if(k>=0) d.setSelectionRange(k,k+3); } return; }
  if(act==="tcheck"){ renderMain(); const r=document.querySelector(".tres"); if(r) r.scrollIntoView({block:"nearest"}); return; }
  if(act==="tuse"){
    if(!filled(plan.dqTutor.draft)) return toast("Write a draft first.");
    if(filled(plan.dq.driving) && plan.dq.driving.trim()!==plan.dqTutor.draft.trim() && !confirm("Replace your current driving question with this draft?")) return;
    plan.dq.driving = plan.dqTutor.draft.trim(); save(); renderSteps(); renderMain(); toast("Driving question saved"); return;
  }
  if(act==="tsumm"){
    const t = plan.dqTutor;
    if(!filled(t.task) && !filled(t.issue)) return toast("Describe the end product in step 3 first.");
    const ev = focusStds().filter(s=>filled(t.evidence[s.id])).map(s=>`${s.code}: ${t.evidence[s.id].trim()}`);
    const desc = [ [t.task, t.purpose].filter(filled).map(x=>x.trim()).join(" "), filled(t.audience)?"Audience: "+t.audience.trim()+".":"", ev.length?"Rubric rows:\n"+ev.join("\n"):"" ].filter(Boolean).join("\n");
    const title = "End product" + (filled(plan.dq.driving) ? ": " + plan.dq.driving.trim() : "");
    const list = plan.assess.summative;
    const emptyIdx = list.findIndex(a=>!filled(a.title)&&!filled(a.desc));
    const item = {id:uid(), title, desc};
    if(emptyIdx>=0) list[emptyIdx] = item; else list.push(item);
    save(); renderSteps(); toast("Added to Summative assessments"); return;
  }
  if(act==="tpre"){
    if(!filled(plan.dqTutor.prepost)) return toast("Describe the pre/post assessment first.");
    if(filled(plan.assess.pre) && !confirm("Replace your current pre-assessment?")) return;
    plan.assess.pre = plan.dqTutor.prepost.trim(); save(); renderSteps(); toast("Pre-assessment saved"); return;
  }
  if(act==="exportDocx") return exportDocx();
  if(act==="exportPdf") return exportPdf();
  if(act==="exportJson") return saveFile(fileBase()+".json", JSON.stringify(plan, null, 2));
  if(act==="importJson") return document.getElementById("fileIn").click();
  if(act==="reset"){
    if(!confirm("Start a new plan? Your current plan will be cleared from this browser. Download it first if you want to keep a copy.")) return;
    plan = blankPlan(); openLessons.clear(); current="overview"; save(); renderAll(true); toast("Started a new plan");
    return;
  }
  if(act==="loadSample"){
    if(!confirm("Load the sample unit? It replaces what is on screen now.")) return;
    plan = normalize(SAMPLE()); openLessons.clear(); current="overview"; save(); renderAll(true); toast("Sample unit loaded");
  }
});
document.getElementById("fileIn").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ const d = JSON.parse(r.result); if(!d.meta||!d.lessons) throw 0; plan = normalize(d); openLessons.clear(); current="overview"; save(); renderAll(true); toast("Plan opened"); }catch(err){ toast("That file is not a Unit Plan Builder backup."); } };
  r.readAsText(f); e.target.value="";
});

let toastT; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2800); }

/* ---------- export content ---------- */
function fileBase(){ return (filled(plan.meta.title)?plan.meta.title:"Unit Plan").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60) || "Unit_Plan"; }
function numbered(arr){ return arr.filter(filled).map((s,i)=>`${i+1}. ${s.trim()}`).join("\n"); }
function codesFor(ids){ return plan.standards.filter(s=>ids.includes(s.id)&&filled(s.code)).map(s=>s.code.trim()).join("; "); }
function objsFor(ids){ return plan.objectives.map((o,i)=>ids.includes(o.id)&&filled(o.text)?String(i+1):null).filter(Boolean).join(", "); }

function buildRows(){
  const p = plan, rows = [];
  const add = (label, blocks) => rows.push({label, blocks: blocks.filter(b=>filled(b.text))});
  add("Unit Plan", [{text:p.meta.title}, {h:"Grade level", text:p.meta.grade}, {h:"Content areas", text:p.meta.subject}, {h:"Prepared by", text:p.meta.author}]);
  add("Unit Overview", [{text:p.meta.overview}]);
  if(p.curr.ckla==="yes"){
    const rel = (CKLA_REL.find(r=>r[0]===p.curr.relation)||[])[1]||"";
    const gname = p.curr.grade==="K" ? "Kindergarten" : (filled(p.curr.grade) ? "Grade "+p.curr.grade : "");
    add("Classroom Curriculum Connection", [{text:["Amplify CKLA", gname].filter(Boolean).join(", ")}, {h: ["K","1","2"].includes(p.curr.grade)?"Knowledge Domain":"CKLA Unit", text:cklaDomain()}, {h:"Skills Unit", text:cklaSkills()}, {h:"Connection", text:[rel, p.curr.explain].filter(filled).map(s=>s.trim()).join(". ")}]);
  }
  add("Driving Question", [{text:p.dq.driving}]);
  if([p.dqTutor.bigIdea,p.dqTutor.understanding,p.dqTutor.essential].some(filled))
    add("Big Idea, Enduring Understanding, Essential Question", [{h:"Big Idea", text:p.dqTutor.bigIdea}, {h:"Enduring Understanding", text:p.dqTutor.understanding}, {h:"Essential Question", text:p.dqTutor.essential}]);
  add("Subquestions that support DQ", [{text:p.dq.subs.filter(filled).map(s=>s.trim()).join("\n")}]);
  add("Standards (Include Content area)", p.standards.filter(s=>filled(s.code)||filled(s.text)).map(s=>({text:`${s.code.trim()} ${s.text.trim()}`.trim()})));
  add("Learning Objectives", [{text:"By the end of this unit, students will be able to:"}, {text:numbered(p.objectives.map(o=>o.text))}]);
  const form = p.assess.formative.filter(a=>filled(a.title)||filled(a.desc)).map((a,i)=>`${i+1}. ${a.title.trim()}${filled(a.title)&&filled(a.desc)?": ":""}${a.desc.trim()}${filled(a.link)?"\n"+a.link.trim():""}`).join("\n");
  const summ = p.assess.summative.filter(a=>filled(a.title)||filled(a.desc)).map((a,i)=>`${i+1}. ${a.title.trim()}${filled(a.title)&&filled(a.desc)?": ":""}${a.desc.trim()}`).join("\n");
  add("Assessment Strategies", [{h:"Pre-Assessment / Survey", text:p.assess.pre}, {h:"Formative Assessments", text:form}, {h:"Summative Assessments", text:summ}]);
  p.lessons.forEach((l,i)=>{
    const t = l.type==="ira" ? " [IRA]" : l.type==="detailed" ? " [Detailed plan]" : "";
    add(`Lesson ${i+1}: ${filled(l.title)?l.title.trim():"Untitled"}${t}`, [
      {h:"Brief description of the activity", text:l.desc},
      {h:"Materials required", text:l.materials},
      {h:"Standards", text:codesFor(l.standards)},
      {h:"Objectives", text:objsFor(l.objectives)},
      {h:"CKLA connection", text: p.curr.ckla==="yes" ? ({knowledge:"Knowledge Strand",skills: cklaK2()?"Skills Strand":"Practices skills from CKLA",both:"Knowledge and Skills Strands",unit:"Connects to the CKLA unit"}[l.strand]||"") : ""},
      ...(l.type!=="regular" ? [{h:"Procedure", text:l.procedure}, {h:"Check for understanding", text:l.check}] : []),
      {h:"Estimated time", text:l.time}
    ]);
  });
  add("Resources and Materials", [{h:"Textbooks, reading materials, online resources", text:p.resources.texts}, {h:"Technology tools", text:p.resources.tech}, {h:"Other resources", text:p.resources.other}]);
  add("Differentiation Strategies", [{h:"Strategy for gifted learners", text:p.diff.gifted}, {h:"Strategy for students requiring additional support", text:p.diff.support}, {h:"Other differentiation strategies", text:p.diff.other}]);
  add("Reflection and Adaptation", [{h:"What worked well and engaged students effectively?", text:p.reflect.worked}, {h:"What areas need improvement or adjustment for future iterations?", text:p.reflect.improve}]);
  return rows;
}

function saveFile(name, data){
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:"application/octet-stream"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Downloaded " + name);
  }catch(e){ toast("Could not download the file. Try another browser."); }
}

async function exportDocx(){
  if(!window.docx){ toast("The Word exporter did not load. Check your connection and reload."); return; }
  const D = window.docx;
  const P = (children, opts={}) => new D.Paragraph(Object.assign({children}, opts));
  const lines = t => String(t).split(/\n/);
  const rows = buildRows().map(r=>{
    const content = [];
    r.blocks.forEach((b,bi)=>{
      if(b.h) content.push(P([new D.TextRun({text:b.h, bold:true})], {spacing:{before: bi?120:0, after:40}}));
      lines(b.text).forEach(l=>content.push(P([new D.TextRun(l)], {spacing:{after:40}})));
    });
    if(!content.length) content.push(P([new D.TextRun("")]));
    return new D.TableRow({cantSplit:false, children:[
      new D.TableCell({width:{size:22, type:D.WidthType.PERCENTAGE}, shading:{fill:"DCE6F0", type:D.ShadingType.CLEAR, color:"auto"}, margins:{top:80,bottom:80,left:100,right:100},
        children:[P([new D.TextRun({text:r.label, bold:true})])]}),
      new D.TableCell({width:{size:78, type:D.WidthType.PERCENTAGE}, margins:{top:80,bottom:80,left:120,right:120}, children:content})
    ]});
  });
  const doc = new D.Document({
    creator: plan.meta.author || "Unit Plan Builder",
    title: plan.meta.title || "Unit Plan",
    styles:{default:{document:{run:{font:"Calibri", size:22}}}},
    sections:[{properties:{page:{margin:{top:1080,bottom:1080,left:1080,right:1080}}}, children:[
      P([new D.TextRun({text:"Unit Plan: " + (plan.meta.title || "Untitled"), bold:true, size:32})], {spacing:{after:200}}),
      new D.Table({width:{size:100, type:D.WidthType.PERCENTAGE}, rows})
    ]}]
  });
  try{ const blob = await D.Packer.toBlob(doc); await saveFile(fileBase()+".docx", blob); }
  catch(e){ toast("Could not build the Word file."); }
}

async function exportPdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("The PDF exporter did not load. Check your connection and reload."); return; }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"letter"});
  if(typeof doc.autoTable!=="function"){ toast("The PDF exporter did not load fully. Reload and try again."); return; }
  const clean = s => String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,"-").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,"");
  doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text(clean("Unit Plan: " + (plan.meta.title || "Untitled")), 14, 18);
  const body = buildRows().map(r=>[clean(r.label), clean(r.blocks.map(b=>(b.h? b.h+"\n":"")+b.text).join("\n\n"))]);
  doc.autoTable({
    startY:24, body, theme:"grid", margin:{left:14,right:14},
    styles:{font:"helvetica", fontSize:9.5, cellPadding:2.6, valign:"top", overflow:"linebreak", lineColor:[180,190,200], lineWidth:0.2, textColor:[29,42,54]},
    columnStyles:{0:{cellWidth:38, fillColor:[220,230,240], fontStyle:"bold"}, 1:{cellWidth:"auto"}}
  });
  await saveFile(fileBase()+".pdf", doc.output("blob"));
}

document.querySelectorAll("[data-art]").forEach(i=>{ i.src = ART[i.dataset.art]; });
renderAll();
if(load()) document.getElementById("saveState").textContent = "Saved in this browser";
})();
